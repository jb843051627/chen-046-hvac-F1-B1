<th:block th:include="include :: footer"/>
<script>
    layui.use(['table', 'jquery'], function () {
        let table = layui.table;
        let $ = layui.jquery;
        let logId = null;
        let m = location.search.match(/[?&]id=(\d+)/);
        if (m) {
            logId = m[1];
        }
        let cols = [
            [
                {title: '动作', field: 'action', align: 'center', toolbar: '#hvacTrace-action'},
                {title: '环节（离开→到达）', field: 'stage', align: 'center', toolbar: '#hvacTrace-stage'},
                {title: '本环节处置说明快照', field: 'content', align: 'left'},
                {title: '谁动的手', field: 'actionBy', align: 'center'},
                {title: '什么时候', field: 'actionTime', align: 'center'},
                {title: '为什么动（回退原因等）', field: 'actionRemark', align: 'left'}
            ]
        ];
        table.render({
            elem: '#hvacTrace-table',
            url: rootPath + "/hvacCleanLog/trace?id=" + logId,
            page: false,
            method: 'get',
            cols: cols,
            skin: 'line',
            defaultToolbar: []
        });
    })
</script>
